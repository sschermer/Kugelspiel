name: Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate ten all-points labyrinths, functional mechanics and jump chains
        run: |
          mkdir -p /tmp/kugelspiel-check
          javac -encoding UTF-8 -d /tmp/kugelspiel-check app/src/main/java/de/sschermer/kugelspiel/LevelData.java app/src/main/java/de/sschermer/kugelspiel/HandcraftedLevels.java app/src/main/java/de/sschermer/kugelspiel/CuratedWorlds.java tools/LevelRouteTest.java app/src/main/java/de/sschermer/kugelspiel/BounceChain.java tools/BounceChainTest.java app/src/main/java/de/sschermer/kugelspiel/HorizontalMotion.java app/src/main/java/de/sschermer/kugelspiel/HalfScreenControls.java tools/HalfScreenControlsTest.java
          java -cp /tmp/kugelspiel-check de.sschermer.kugelspiel.LevelRouteTest
          java -cp /tmp/kugelspiel-check de.sschermer.kugelspiel.BounceChainTest
          java -cp /tmp/kugelspiel-check de.sschermer.kugelspiel.HalfScreenControlsTest
      - name: Render level maps for design review
        run: |
          javac -encoding UTF-8 -cp /tmp/kugelspiel-check -d /tmp/kugelspiel-check tools/LevelPreview.java
          java -Djava.awt.headless=true -cp /tmp/kugelspiel-check de.sschermer.kugelspiel.LevelPreview /tmp/kugelspiel-previews
      - uses: actions/upload-artifact@v4
        with:
          name: orbiflux-iteration-018-level-overviews
          path: /tmp/kugelspiel-previews/level_*.png
          if-no-files-found: error
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: orbiflux-iteration-018-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct-download preview APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          TAG="v${VERSION}-preview"
          APK="ORBIFLUX-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease \
              --title "ORBIFLUX ${VERSION} - Android Test-APK" \
              --notes "Vorschau zur privaten Erprobung. Debug-signierte APK; der Signierschlüssel wechselt zwischen CI-Builds. Deshalb ist möglicherweise die Deinstallation der älteren APK nötig; dabei können lokale Spielstände verloren gehen. Kein finaler App-Release."
          fi
